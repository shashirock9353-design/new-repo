services:
  - type: web
    name: skill-gap-analyzer-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: starter
    disk:
      name: skill-gap-analyzer-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/skill_gap.db
      - key: CORS_ORIGINS
        value: "*"
